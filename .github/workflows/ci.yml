name: Private bridge verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Verify ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.3.0"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify exact official runtime and native architecture
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if(process.version !== "v26.3.0" || process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
          printf 'BRIDGE_SEA_NODE=%s\n' "$(node -p process.execPath)" >> "$GITHUB_ENV"
          printf 'BRIDGE_PYTHON=%s\n' "$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - run: npm ci
      - run: python -m pip install --requirement tests/clients/requirements.txt
      - name: Install Chromium for actual browser journeys
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Complete verification, packaging and clean native MCP smoke
        run: npm run check
      - name: Audit all runtime and packaging dependencies
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/*.mcpb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
