name: Private bridge release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verified:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verified
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Verify tag, expected platform artifacts and publish private release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          test "$RELEASE_TAG" = "v$version"
          for target in linux-x64 darwin-arm64 win32-x64; do
            test -f "release-assets/firefly-agent-bridge-$version-$target.tar.gz"
          done
          for target in darwin-arm64 win32-x64; do
            test -f "release-assets/firefly-agent-bridge-$version-$target.mcpb"
          done
          cd release-assets
          sha256sum *.tar.gz *.mcpb > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.mcpb SHA256SUMS --verify-tag --title "Firefly Agent Bridge $RELEASE_TAG" --notes-file ../CHANGELOG.md
