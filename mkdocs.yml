site_name: Firefly Agent Bridge
site_url: https://fireflyframework.github.io/firefly-agent-bridge/
site_description: Local coding jobs, subscriptions, workflows and execution records
site_author: Firefly Software Foundation
docs_dir: docs
site_dir: work/docs-site
use_directory_urls: true
theme:
  name: material
  font: false
  logo: assets/brand/bridge-lockup-small-light.svg
  favicon: assets/brand/bridge-favicon-light.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark appearance
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light appearance
  features:
    - navigation.tabs
    - navigation.footer
    - toc.follow
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - search.suggest
nav:
  - Home: index.md
  - Setup:
      - Installation: installation.md
      - Host integrations: integrations.md
      - Provider configuration: configuration.md
      - Tokens and access: tokens.md
      - Compatibility: compatibility.md
  - Work:
      - Console tour: dashboard.md
      - SDK and function calls: openai-compatible.md
      - Workflows: workflows.md
      - Claude agents and skills: subagents.md
      - Development workflow: advanced-workflows.md
      - Audit and file activity: audit.md
  - Operate:
      - Service lifecycle: operations.md
      - Cluster quota pool: cluster.md
      - Security boundaries: security.md
      - Troubleshooting: troubleshooting.md
      - Remote access: tunnels.md
  - Reference:
      - Architecture: architecture.md
      - Internal prompts: prompts.md
      - HTTP API: api.md
      - CLI and MCP tools: reference.md
      - Verification and packaging: verification.md
      - Publish documentation: documentation-publishing.md
plugins:
  - search
markdown_extensions:
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
extra:
  generator: false
  discovery:
    font: assets/fonts/manrope/manrope-latin-wght-normal.woff2
    logo: assets/brand/bridge-lockup-light.svg
    notice: assets/brand/NOTICE
    font_notice: assets/fonts/manrope/OFL.txt
    descriptions:
      assets/BRAND-NOTICE.md: Read the ownership and permitted-use notices for Firefly parent marks, bridge visual assets and the bundled Manrope font.
extra_css:
  - assets/docs.css
copyright: Copyright &copy; 2026 Firefly Software Foundation
